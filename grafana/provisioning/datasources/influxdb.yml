apiVersion: 1

datasources:
  - name: InfluxDB_Plastika
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: plastika
      defaultBucket: production_metrics
    secureJsonData:
      token: plastika-super-secret-auth-token-12345
    editable: true
