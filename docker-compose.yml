version: '3.8'

services:
  influxdb:
    image: influxdb:2.7-alpine
    container_name: plastika_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword123
      - DOCKER_INFLUXDB_INIT_ORG=plastika
      - DOCKER_INFLUXDB_INIT_BUCKET=production_metrics
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=plastika-super-secret-auth-token-12345
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - plastika_net

  grafana:
    image: grafana/grafana:latest
    container_name: plastika_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - influxdb
    networks:
      - plastika_net

networks:
  plastika_net:
    driver: bridge

volumes:
  influxdb_data:
  influxdb_config:
  grafana_data:
